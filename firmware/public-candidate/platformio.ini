[platformio]
core_dir = ../../.tools/platformio-core
build_cache_dir = ../../.tools/platformio-cache

[env]
platform = espressif32@6.13.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
extra_scripts = pre:scripts/select_mp3_sources.py
build_unflags =
  -std=gnu++11
build_flags =
  -DOPEN_RADIO_RELEASE=\"0.4.5\"
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=0
  -DOPEN_RADIO_BUILD_LANE=\"public-candidate\"
  -DESP_A2D_AUDIO_STATE_SUSPEND=ESP_A2D_AUDIO_STATE_REMOTE_SUSPEND
  -Wl,-Map,firmware.map
  -I../common/include
  -I../generated
  -I../../renderer/include
  -I../../renderer/generated
[env:core2-public-candidate]
build_flags =
  ${env.build_flags}
  -DOPEN_RADIO_VARIANT_FULL=1
  ; Speaker return, measured on the lab lane on 2026-10-12 (10 of 10 cycles on
  ; RMF FM back in 2.0-6.1 s from the speaker's first link; docs/audits/
  ; 2026-09-24-cc-audyt-0-4-2/04-PLAN-POWROT-GLOSNIKA.md): B5/B5c cap the
  ; local-audio wait at 30 s, B5b dial over an up ACL, B5d media start without
  ; a local block, B3 close the speaker's inbound link and call it back. B2
  ; and the B1 role log stay in the lab lane: both touch Bluedroid state from
  ; the loop task.
  -DOPEN_RADIO_BT_DEFER_CAP_MS=30000U
  -DOPEN_RADIO_BT_DIAL_OVER_ACL=1
  -DOPEN_RADIO_BT_STANDBY_WITHOUT_LOCAL=1
  -DOPEN_RADIO_BT_REPLACE_INBOUND=1
lib_deps =
  OpenRadioRenderer=symlink://../../renderer
  https://github.com/m5stack/M5Unified.git#b1ffcc677014ed8bd01e5a1f240736ae654bfe12
  M5GFX=https://github.com/m5stack/M5GFX.git#ad9b814264d4e2000e9f30070002310bbccaffc9
  https://github.com/pschatzmann/ESP32-A2DP.git#b6da4744286ca15b6f1dee607c077a4747294dd4
  https://github.com/earlephilhower/ESP8266Audio.git#d6184e08977c0f15f1b09eeee119b238ce562383

[env:core2-diag-0-4-5]
; 0.4.5 lab lane: the core2-public-candidate flags (the 0.4.5 fixes live in
; the shared code) plus the logs of plan A1/A2 (docs/audits/
; 2026-10-25-cc-pamiec-soak-0-4-4/, section 7). Never published; identifiable
; on the device by the release string below.
build_flags =
  ${env.build_flags}
  -DOPEN_RADIO_RELEASE=\"0.4.5-lab5\"
  -DOPEN_RADIO_VARIANT_FULL=1
  -DOPEN_RADIO_BT_DEFER_CAP_MS=30000U
  -DOPEN_RADIO_BT_DIAL_OVER_ACL=1
  -DOPEN_RADIO_BT_STANDBY_WITHOUT_LOCAL=1
  -DOPEN_RADIO_BT_REPLACE_INBOUND=1
  -DOPEN_RADIO_DIAG_045=1
lib_deps =
  OpenRadioRenderer=symlink://../../renderer
  https://github.com/m5stack/M5Unified.git#b1ffcc677014ed8bd01e5a1f240736ae654bfe12
  M5GFX=https://github.com/m5stack/M5GFX.git#ad9b814264d4e2000e9f30070002310bbccaffc9
  https://github.com/pschatzmann/ESP32-A2DP.git#b6da4744286ca15b6f1dee607c077a4747294dd4
  https://github.com/earlephilhower/ESP8266Audio.git#d6184e08977c0f15f1b09eeee119b238ce562383

[env:core2-hardware-lab]
build_flags =
  ${env.build_flags}
  ; The shared [env] block stamps every lane "0.4.1" and that string is what
  ; the About screen paints. On 2026-09-09 the owner's Core2 v1.3 ran the
  ; 0.4.2 lab image, with different console access rules than the published
  ; release, while telling him it was 0.4.1. A lab build has to be
  ; identifiable from the device, or a hardware report cannot be attributed
  ; to the code that produced it.
  ; No -U flag here. PlatformIO hands -D to SCons as CPPDEFINES and leaves
  ; -U in CCFLAGS, applied afterwards, so -U deletes the define instead of
  ; replacing it and the screen fell back to "dev" (seen in the object file).
  ; Two -D of one macro are fine: the last wins.
  ; Careful with comments here: check-firmware-lock.mjs greps the WHOLE file for
  ; floating git refs, so those four branch names must not appear even in prose.
  -DOPEN_RADIO_RELEASE=\"0.4.4-lab\"
  ; Speaker plan B2 (2026-10-12): the cube asks for the central role when it
  ; accepts the speaker's own call, so it accepts that call again: the
  ; dial-only recovery flag is off. B1 on the cube that morning: the speaker
  ; called in twice, the cube was peripheral both times, both links dropped
  ; with reason 264. The role stays in the log. The 2048-byte serial transmit
  ; buffer left with D3 (2026-09-26).
  -DOPEN_RADIO_BT_ACCEPT_AS_CENTRAL=1
  -DOPEN_RADIO_BT_ROLE_LOG=1
  ; Speaker plan B5 and B5b (2026-10-12): the local-audio gate before a retry
  ; waits at most 30 s, and not at all once the speaker's own ACL is up (B2 run
  ; that day: cycle 4 deferred the profile dial on four inbound links, each
  ; dropped with 264, sound back only after 125 s when the speaker opened it).
  -DOPEN_RADIO_BT_DEFER_CAP_MS=30000U
  -DOPEN_RADIO_BT_DIAL_OVER_ACL=1
  ; Speaker plan B5d (2026-10-12): a connected link no longer waits for a block
  ; in the local speaker before media may start (B5c run, cycle 4: the local
  ; speaker had starved, the Bluetooth queue was full, and the 5 s buffer
  ; timeout tore the link down; sound came 59 s after the speaker's first call).
  -DOPEN_RADIO_BT_STANDBY_WITHOUT_LOCAL=1
  ; Speaker plan B3, narrow (2026-10-12): an inbound link on which the cube is
  ; slave is closed before any profile opens on it, and the cube pages the
  ; speaker itself once the ACL is down (three such links died with 264 at
  ; 16 s that day; the dial is made while the speaker is known to be on).
  -DOPEN_RADIO_BT_REPLACE_INBOUND=1
  -DOPEN_RADIO_VARIANT_FULL=1
  -DOPEN_RADIO_HAS_HLS=1
  -DOPEN_RADIO_HAS_LOGO_PACK=1
  -DOPEN_RADIO_LAB_CONSOLE=1
  -I../../assets-local/station-logos
lib_deps =
  OpenRadioRenderer=symlink://../../renderer
  https://github.com/m5stack/M5Unified.git#b1ffcc677014ed8bd01e5a1f240736ae654bfe12
  M5GFX=https://github.com/m5stack/M5GFX.git#ad9b814264d4e2000e9f30070002310bbccaffc9
  https://github.com/pschatzmann/ESP32-A2DP.git#b6da4744286ca15b6f1dee607c077a4747294dd4
  https://github.com/earlephilhower/ESP8266Audio.git#d6184e08977c0f15f1b09eeee119b238ce562383

[env:core2-owner-production]
build_flags =
  ${env.build_flags}
  -DOPEN_RADIO_VARIANT_FULL=1
  ; Speaker return, measured on the lab lane on 2026-10-12 (10 of 10 cycles on
  ; RMF FM back in 2.0-6.1 s from the speaker's first link; docs/audits/
  ; 2026-09-24-cc-audyt-0-4-2/04-PLAN-POWROT-GLOSNIKA.md): B5/B5c cap the
  ; local-audio wait at 30 s, B5b dial over an up ACL, B5d media start without
  ; a local block, B3 close the speaker's inbound link and call it back. B2
  ; and the B1 role log stay in the lab lane: both touch Bluedroid state from
  ; the loop task.
  -DOPEN_RADIO_BT_DEFER_CAP_MS=30000U
  -DOPEN_RADIO_BT_DIAL_OVER_ACL=1
  -DOPEN_RADIO_BT_STANDBY_WITHOUT_LOCAL=1
  -DOPEN_RADIO_BT_REPLACE_INBOUND=1
  -DOPEN_RADIO_HAS_LOGO_PACK=1
  -I../../assets-local/station-logos
lib_deps =
  OpenRadioRenderer=symlink://../../renderer
  https://github.com/m5stack/M5Unified.git#b1ffcc677014ed8bd01e5a1f240736ae654bfe12
  M5GFX=https://github.com/m5stack/M5GFX.git#ad9b814264d4e2000e9f30070002310bbccaffc9
  https://github.com/pschatzmann/ESP32-A2DP.git#b6da4744286ca15b6f1dee607c077a4747294dd4
  https://github.com/earlephilhower/ESP8266Audio.git#d6184e08977c0f15f1b09eeee119b238ce562383

[env:core2-onboarding-only]
build_flags =
  ${env.build_flags}
  -DOPEN_RADIO_VARIANT_ONBOARDING_ONLY=1
lib_deps =
  OpenRadioRenderer=symlink://../../renderer
  https://github.com/m5stack/M5Unified.git#b1ffcc677014ed8bd01e5a1f240736ae654bfe12
  M5GFX=https://github.com/m5stack/M5GFX.git#ad9b814264d4e2000e9f30070002310bbccaffc9

[env:core2-local-speaker-fallback]
